<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ title | e }}</title>
	<style>
		body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; background: #fff; }
		.bt-checkout { max-width: 480px; margin: 48px auto; padding: 0 16px; }
		.bt-checkout h1 { font-size: 1.5rem; margin-bottom: 4px; }
		.bt-amount { font-size: 1.25rem; color: #6b7280; margin-bottom: 24px; }
		.bt-error { color: #dc2626; margin: 12px 0; min-height: 1.5em; }
		.bt-actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
		.bt-actions button { flex: 1; padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 6px; background: #111827; color: #fff; cursor: pointer; }
		.bt-actions button:disabled { opacity: 0.5; cursor: default; }
	</style>
</head>
<body>
<div class="bt-checkout">
	{% if error %}
		<h1>{{ _("Payment unavailable") | e }}</h1>
		<p class="bt-error">{{ error | e }}</p>
		{% if cancel_url %}<a href="{{ cancel_url | e }}">{{ _("Back to cart") | e }}</a>{% endif %}
	{% else %}
		<h1>{{ _("Pay by card") | e }}</h1>
		<div class="bt-amount">{{ amount | e }} {{ currency | e }}</div>
		<div id="dropin-container"></div>
		<p class="bt-error" id="bt-error" role="alert"></p>
		<div class="bt-actions">
			<button id="bt-pay" disabled>{{ _("Pay") | e }} {{ amount | e }} {{ currency | e }}</button>
			<a href="{{ cancel_url | e }}">{{ _("Cancel") | e }}</a>
		</div>
	{% endif %}
</div>
{% if not error %}
<script src="https://js.braintreegateway.com/web/dropin/1.44.1/js/dropin.min.js"></script>
<script>
(function () {
	const payButton = document.getElementById("bt-pay");
	const errorBox = document.getElementById("bt-error");
	const threeDSecure = {{ three_d_secure | tojson }};

	function showError(message) {
		errorBox.textContent = message;
		payButton.disabled = false;
	}

	braintree.dropin.create(
		{
			authorization: {{ client_token | tojson }},
			container: "#dropin-container",
			threeDSecure: threeDSecure,
		},
		function (createError, instance) {
			if (createError) {
				// Not showError: the Pay button has no handler without Drop-in, so it stays disabled.
				errorBox.textContent = {{ _("The card form could not load. Please refresh the page.") | tojson }};
				return;
			}
			payButton.disabled = false;

			payButton.addEventListener("click", function () {
				// Disabled until the server answers, so a double click cannot send two nonces.
				payButton.disabled = true;
				errorBox.textContent = "";
				const options = threeDSecure
					? { threeDSecure: { amount: {{ amount | tojson }}, email: {{ email | tojson }} || undefined } }
					: {};

				instance.requestPaymentMethod(options, function (requestError, payload) {
					if (requestError) {
						showError(requestError.message);
						return;
					}
					// The sale requires the liability shift, so Braintree would decline this card anyway.
					if (threeDSecure && !payload.liabilityShifted) {
						instance.clearSelectedPaymentMethod();
						showError({{ _("Card verification failed. Please try again or use another card.") | tojson }});
						return;
					}

					fetch("/api/method/bwh_payments.bwh_payments.doctype.braintree_gateway_settings.braintree_gateway_settings.pay", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							"X-Frappe-CSRF-Token": {{ csrf_token | tojson }},
						},
						body: JSON.stringify({ session: {{ session | tojson }}, nonce: payload.nonce }),
					})
						.then(function (response) {
							return response.json();
						})
						.then(function (data) {
							const result = data.message || {};
							if (result.redirect_url) {
								window.location.href = result.redirect_url;
								return;
							}
							instance.clearSelectedPaymentMethod();
							showError(result.error || readServerError(data));
						})
						.catch(function () {
							showError({{ _("Something went wrong. Please check your connection and try again.") | tojson }});
						});
				});
			});
		}
	);

	function readServerError(data) {
		try {
			return JSON.parse(JSON.parse(data._server_messages)[0]).message;
		} catch (e) {
			return {{ _("The payment could not be completed.") | tojson }};
		}
	}
})();
</script>
{% endif %}
</body>
</html>
